name: Build BusinessTourLive EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore desktop/BusinessTourLive.csproj

      - name: Publish single EXE
        run: dotnet publish desktop/BusinessTourLive.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BusinessTourLive-win-x64
          path: publish/BusinessTourLive.exe
          if-no-files-found: error
